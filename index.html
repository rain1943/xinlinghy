<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心灵花园 - 抑郁厌学青少年社会工作服务项目</title>
    <style>
        /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
        }

        /* 页面背景与基础样式 */
        body {
            background-color: #f9f9f9;
            color: #333;
            line-height: 1.6;
        }

        /* 顶部导航栏 */
        .header {
            background-color: #5a9e8b; /* 治愈系绿色 */
            padding: 15px 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            width: 90%;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .nav-menu {
            display: flex;
            list-style: none;
        }

        .nav-menu li {
            margin-left: 30px;
        }

        .nav-menu a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            transition: color 0.3s;
        }

        .nav-menu a:hover {
            color: #f0f8f5;
        }

        /* 横幅区域 */
        .banner {
            background: linear-gradient(rgba(90, 158, 139, 0.8), rgba(90, 158, 139, 0.8)), 
                        url("https://picsum.photos/1920/600?nature=green") center/cover no-repeat;
            color: white;
            text-align: center;
            padding: 100px 0;
        }

        .banner h1 {
            font-size: 42px;
            margin-bottom: 20px;
        }

        .banner p {
            font-size: 18px;
            max-width: 800px;
            margin: 0 auto;
        }

        /* 项目简介区域 */
        .intro {
            width: 90%;
            max-width: 1200px;
            margin: 60px auto;
            text-align: center;
        }

        .intro h2 {
            font-size: 32px;
            color: #5a9e8b;
            margin-bottom: 30px;
            position: relative;
        }

        .intro h2::after {
            content: "";
            display: block;
            width: 80px;
            height: 3px;
            background-color: #5a9e8b;
            margin: 10px auto;
        }

        .intro-content {
            font-size: 16px;
            color: #555;
            max-width: 1000px;
            margin: 0 auto 40px;
            line-height: 1.8;
        }

        /* 核心服务模块 */
        .services {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto 80px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .service-card {
            background-color: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            transition: transform 0.3s;
        }

        .service-card:hover {
            transform: translateY(-5px);
        }

        .service-card h3 {
            color: #5a9e8b;
            font-size: 22px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .service-card h3::before {
            content: "🌱";
            margin-right: 10px;
            font-size: 24px;
        }

        .service-card p {
            color: #666;
            font-size: 15px;
            line-height: 1.7;
        }

        /* 底部信息 */
        .footer {
            background-color: #5a9e8b;
            color: white;
            padding: 40px 0;
            text-align: center;
        }

        .footer p {
            margin-bottom: 10px;
            font-size: 14px;
        }

        /* 响应式适配 */
        @media (max-width: 768px) {
            .nav-container {
                flex-direction: column;
            }

            .nav-menu {
                margin-top: 15px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .nav-menu li {
                margin: 5px 15px;
            }

            .banner h1 {
                font-size: 32px;
            }

            .banner p {
                font-size: 16px;
            }

            .intro h2 {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>

    <!-- 以下可扩展各板块内容，示例： -->
    <div id="home" style="padding: 50px; text-align: center;">
        <h1>欢迎来到心灵花园</h1>
        <p>专注于抑郁厌学青少年的社会工作服务，守护每一颗成长的心灵。</p>
		<p><h4>《“心灵花园”抑郁、厌学青少年社会工作服务项目》是由昆山市民政局、昆山市慈善总会主办，昆山市大同社会工作服务中心承接的“昆山市公益创投活动”项目，于2023年12月正式启动，目前已持续2年。
项目依托园艺疗法和家庭治疗的理论指导，开展园艺疗愈、自我探索及家庭团辅服务，旨在帮助孩子们缓解抑郁症状，唤醒身体能量；解决成长问题，探寻未来方向；改善亲子间互动方式，促进家庭系统正向升级。
</h4></p>

</body>
