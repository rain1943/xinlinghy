	<style>
		.content {
		            width: 90%;
		            max-width: 1200px;
		            margin: 0 auto;
		            font-size: 16px;
		            line-height: 1.8;
		        }
		        /* 黄色标题标签 */
		        .section-title {
		            background: #ffeb3b;
		            color: #000;
		            font-size: 18px;
		            font-weight: bold;
		            padding: 5px 10px;
		            display: inline-block;
		            border: 1px solid #000;
		            margin: 20px 0 10px;
		        }
		        /* 红色注意提示 */

		        }
		        /* 公益热线样式 */
		        .hotline {
		            margin: 20px 0;
		            text-align: center;
		        }
		        /* 响应式适配 */
		        @media (max-width: 768px) {
		            .content {
		                font-size: 14px;
		            }
		            .section-title {
		                font-size: 16px;
		            }
		        }
		.center{
			text-align :center;
		}
		.color{
		color: #8fe800;
		}
		.inline-box {
			  position: fixed;    /* 固定定位 */
			  top: 0;             /* 贴在页面最上方 */
			  left: 0;            /* 贴在左边 */
			  right: 0;           /* 贴在右边（铺满宽度） */
			  z-index: 999;   
		  /* 让图片和文字在一行 */
		  display: flex;
		  /* 垂直居中对齐 */
		  align-items: center;
		  /* 图片和文字之间的距离（自己改数字） */
		  gap: 20px;
		  /* 控制整个内容的位置 */
		  margin: 0;
		  white-space: nowrap;
		}
		
		.inline-box h2 {
		  margin: 0; /* 去掉标题默认的边距 */
		}
		
		.inline-box img {
		  vertical-align: middle;
		}
		/* 全局去掉所有链接下划线 */
		.dele
		a,
		a:hover,
		a:visited,
		a:active {
		  text-decoration: none;
		  color: #05d7c6; /* 你可以自己改颜色 */
		}
		body {
		  margin-top: 100px;
		}
		.slider {
		  position: relative;
		  width: 800px;    /* 宽度自己改 */
		  height: 450px;   /* 高度自己改 */
		  margin: 50px auto;
		  overflow: hidden;
		}
		
		/* 图片 */
		.slide {
		  width: 100%;
		  height: 100%;
		  object-fit: cover;
		  display: none; /* 默认隐藏 */
		}
		
		/* 显示当前图片 */
		.slide.active {
		  display: block;
		}
		
		/* 左右按钮 */
		.prev, .next {
		  position: absolute;
		  top: 50%;
		  transform: translateY(-50%);
		  font-size: 30px;
		  color: white;
		  background: rgba(0,0,0,0.3);
		  padding: 10px 20px;
		  cursor: pointer;
		  border: none;
		  z-index: 99;
		}
		
		.prev { left: 20px; }
		.next { right: 20px; }
	</style>
	<script>
	// 获取所有图片
	let slides = document.querySelectorAll('.slide');
	let index = 0;
	
	// 下一张
	function nextSlide() {
	  slides[index].classList.remove('active');
	  index = (index + 1) % slides.length;
	  slides[index].classList.add('active');
	}
	
	// 上一张
	function prevSlide() {
	  slides[index].classList.remove('active');
	  index = (index - 1 + slides.length) % slides.length;
	  slides[index].classList.add('active');
	}
	
	// 绑定按钮
	document.querySelector('.next').onclick = nextSlide;
	document.querySelector('.prev').onclick = prevSlide;
	</script>
